# Matches the Warball XAMPP / MariaDB setup on port 3307.
# Create the schema first: mysql -u root < sql/schema.sql
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3307/fantasy_tracker?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATASOURCE_USERNAME:root}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.h2.console.enabled=false
fantasy.seed.enabled=false
