server.port=8080
spring.application.name=fantasy-tracker-backend

# Default: local H2 file so the app boots without MySQL credentials.
# Switch to XAMPP/MySQL (same ports as Warball) with:
#   --spring.profiles.active=mysql
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:file:./data/fantasy-tracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.username=${DATASOURCE_USERNAME:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

fantasy.ingest.token=${INGEST_TOKEN:}
fantasy.cors.allowed-origins=http://localhost:4200
fantasy.seed.enabled=${FANTASY_SEED_ENABLED:true}
